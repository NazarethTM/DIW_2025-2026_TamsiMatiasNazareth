<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etsy</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
</head>
<body>

    <nav class="py-2 border-bottom bg-white">
        <div class="container-fluid d-flex align-items-center gap-2">

            <a href="#" class="fw-bold fst-italic fs-2 text-decoration-none me-1" style="color: #F1641E; font-family: Georgia, serif;">Etsy</a>

            <button class="btn btn-link text-dark text-decoration-none d-flex align-items-center gap-1 p-0">
                <i class="bi bi-list fs-5"></i>
                <span class="small">Categories</span>
            </button>

            <form class="d-flex flex-grow-1 mx-2" role="search">
                <div class="input-group">
                    <input class="form-control border-2 border-dark border-end-0 rounded-start-pill" type="search" placeholder="Search for anything" aria-label="Search"/>
                    <button class="btn rounded-end-pill px-3" type="submit" style="background-color: #F1641E; border-color: #F1641E;">
                        <i class="bi bi-search text-white"></i>
                    </button>
                </div>
            </form>

            <div class="d-flex align-items-center gap-3">
                <a href="#" class="text-dark text-decoration-none small">Sign in</a>
                <a href="#" class="text-dark text-decoration-none fs-5"><i class="bi bi-circle"></i></a>
                <a href="#" class="text-dark text-decoration-none fs-5"><i class="bi bi-heart"></i></a>
                <a href="#" class="text-dark text-decoration-none fs-5"><i class="bi bi-bag"></i></a>
                <a href="#" class="text-dark text-decoration-none fs-5"><i class="bi bi-person"></i></a>
            </div>
        </div>
    </nav>

    <nav class="py-2 border-bottom bg-white">
        <div class="container-fluid d-flex justify-content-center gap-4 flex-wrap">
            <a href="#" class="text-dark text-decoration-none small">Gifts</a>
            <a href="#" class="text-dark text-decoration-none small">Valentine's Day Gifts</a>
            <a href="#" class="text-dark text-decoration-none small">Home Favourites</a>
            <a href="#" class="text-dark text-decoration-none small">Fashion Finds</a>
            <a href="#" class="text-dark text-decoration-none small">Registry</a>
            <a href="#" class="text-dark text-decoration-none small">Gift Cards</a>
        </div>
    </nav>

    <!-- Sección Hero -->
    <section class="container-fluid p-3">
        <div class="row g-2">

            <!-- Banner izquierdo: morado -->
            <div class="col-8">
                <div class="rounded-3 p-4 d-flex align-items-center overflow-hidden" style="background-color: #c4b5e8; min-height: 240px;">
                    <div class="col-6">
                        <h2 class="fw-bold fs-3">Love can't be late</h2>
                        <p class="small mb-3">Find gifts that ship in 3 days or less.*</p>
                        <button class="btn btn-dark rounded-pill px-4 mb-2">Shop Valentine's Day</button>
                        <p class="text-muted" style="font-size: 0.7rem;">*Orders processed in up to 3 business<br>days. Actual delivery times will vary.</p>
                    </div>
                    <div class="col-6 d-flex justify-content-end">
                        <img src="Captura de pantalla 2026-05-15 153403.png" class="rounded" style="width: 160px; height: 180px; object-fit: cover;">
                    </div>
                </div>
            </div>

            <!-- Banner derecho: accesorios -->
            <div class="col-4">
                <div class="position-relative rounded-3 overflow-hidden" style="min-height: 240px;">
                    <img src="Captura de pantalla 2026-05-15 154828.png" class="w-100 h-100 position-absolute top-0 start-0 object-fit-cover">
                    <div class="position-absolute bottom-0 start-0 p-3">
                        <h5 class="fw-bold text-white mb-0">Affordable Accessories</h5>
                        <a href="#" class="text-white text-decoration-none small">Shop Now</a>
                    </div>
                </div>
            </div>

        </div>
    </section>

    <!-- Sección categorías populares -->
    <section class="container-fluid px-3 py-3">
        <h5 class="fw-bold mb-3">Shop our most popular categories</h5>
        <div class="row row-cols-6 g-2">
            <div class="col">
                <div class="ratio ratio-1x1">
                    <img src="Captura de pantalla 2026-05-15 153233.png" class="rounded-3 object-fit-cover">
                </div>
            </div>
            <div class="col">
                <div class="ratio ratio-1x1">
                    <img src="Captura de pantalla 2026-05-15 153246.png" class="rounded-3 object-fit-cover">
                </div>
            </div>
            <div class="col">
                <div class="ratio ratio-1x1">
                    <img src="Captura de pantalla 2026-05-15 153301.png" class="rounded-3 object-fit-cover">
                </div>
            </div>
            <div class="col">
                <div class="ratio ratio-1x1">
                    <img src="Captura de pantalla 2026-05-15 153314.png" class="rounded-3 object-fit-cover">
                </div>
            </div>
            <div class="col">
                <div class="ratio ratio-1x1">
                    <img src="Captura de pantalla 2026-05-15 153333.png" class="rounded-3 object-fit-cover">
                </div>
            </div>
            <div class="col">
                <div class="ratio ratio-1x1">
                    <img src="Captura de pantalla 2026-05-15 153347.png" class="rounded-3 object-fit-cover">
                </div>
            </div>
        </div>
    </section>

</body>
</html>
