<html lang="es">
  <head>

    <style>
      body {
        font-family: 'Arial', sans-serif;
      }

      .seccion {
        width: 100%;
        min-height: 400px;
        background: linear-gradient(135deg, #ff7e5f, hsl(240, 100%, 50%));
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 40px 20px;
      }

      .seccion h2 {
        color: white;
        font-size: 36px;
        margin-bottom: 20px;
        text-align: center;
      }

      #parrafo {
        color: rgb(181, 189, 227);
        background-color: rgba(0, 0, 0, 0.5);
        padding: 20px 30px;
        border-radius: 8px;
        max-width: 600px;
        text-align: center;
        line-height: 1.6;
        font-size: 16px;
      }

      .contenedor-texto {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div class="seccion">
      <div class="contenedor-texto">
        <h2>Titulo</h2>
        <p id="parrafo">
          Lorem ipsum dolor sit, amet consectetur adipisicing elit. Voluptatem in
          ratione adipisci repellendus facilis, tempore neque iste saepe, veritatis

        </p>
      </div>
    </div>

</html>
