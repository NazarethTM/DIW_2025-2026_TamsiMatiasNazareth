<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 17</title>
    <style>
        .tarjeta {
            background-color: hsl(210, 70%, 90%);
            border: 2px solid rgb(50, 100, 150);
            width: 400px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }

        h1 {
            color: blue;
            margin-bottom: 15px;
            font-size: 28px;
        }

        p {
            color: #2c3e50;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 16px;
        }

        button {
            background-color: rgba(76, 111, 175, 0.7);
            color: hsla(120, 100%, 40%, 1);
            border: none;
        }
        button:hover {
            background-color: rgb(112, 76, 175);
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="tarjeta">
        <h1>Nazareth</h1>
        <p>Información sobre Nazareth</p>
        <button>Contacto</button>
    </div>
</body>
</html>
