<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Carousel</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
  </head>

  <body>
    <!-- ===== NAVBAR ===== -->
   <ul class="nav nav-tabs">
      <li class="nav-item">
        <a class="nav-link active" href="#">Home</a>
      </li>

      <li class="nav-item dropdown">
        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#">
          About
        </a>

        <ul class="dropdown-menu">
          <li><a class="dropdown-item" href="#">About us</a></li>
          <li><hr class="dropdown-divider" /></li>

          <li><a class="dropdown-item" href="#">History</a></li>
          <li><a class="dropdown-item" href="#">Location</a></li>

          <li><hr class="dropdown-divider" /></li>

          <li><a class="dropdown-item" href="#">Other companies</a></li>
        </ul>
      </li>

      <li class="nav-item">
        <a class="nav-link" href="#">Link</a>
      </li>

      <li class="nav-item">
        <a class="nav-link disabled">Disabled</a>
      </li>
    </ul>

    <!-- ===== CAROUSEL ===== -->
    <div
      id="carouselExample"
      class="carousel slide carousel-fade"
      data-bs-ride="carousel"
    >
      <!-- Indicators -->
      <div class="carousel-indicators">
        <button
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide-to="0"
          class="active"
        ></button>

        <button
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide-to="1"
        ></button>

        <button
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide-to="2"
        ></button>

        <button
          type="button"
          data-bs-target="#carouselExample"
          data-bs-slide-to="3"
        ></button>
      </div>

      <!-- Slides -->
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img src="./img/descarga.jpg" class="d-block w-100" alt="Capybara" />
          <div class="carousel-caption d-none d-md-block">
            <h5>Un Capybara</h5>
            <p>Ea</p>
          </div>
        </div>

        <div class="carousel-item">
          <img src="./img/punch.jpg" class="d-block w-100" alt="Punch" />
        </div>

        <div class="carousel-item">
          <img src="./img/vaca.jpg" class="d-block w-100" alt="Vaca" />
        </div>

        <div class="carousel-item">
          <img src="./img/chiuhua.jpg" class="d-block w-100" alt="Chihuahua" />
        </div>
      </div>

      <!-- Controls -->
      <button
        class="carousel-control-prev"
        type="button"
        data-bs-target="#carouselExample"
        data-bs-slide="prev"
      >
        <span class="carousel-control-prev-icon"></span>
      </button>

      <button
        class="carousel-control-next"
        type="button"
        data-bs-target="#carouselExample"
        data-bs-slide="next"
      >
        <span class="carousel-control-next-icon"></span>
      </button>
    </div>
  </body>
</html>
