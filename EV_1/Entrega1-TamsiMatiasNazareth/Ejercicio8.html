<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Document</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 40px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 20px 0;
      }

      th {
        border: 1px solid #ccc;
        background-color: #0066ff;
        color: white;
        padding: 10px;
      }

      td {
        padding: 10px;
        border: 1px solid #ccc;
      }

      tr:nth-child(even) {
        background-color: #f0f0f0;
      }

      tr:nth-child(odd) {
        background-color: #ffffff;
      }

      tr:hover {
        background-color: #d0e4ff;
      }
    </style>
  </head>

  <body>
    <h2>Tablas Personalizadas</h2>

    <table>
      <tr>
        <th>Nombre</th>
        <th>Edad</th>
        <th>Ciudad</th>
      </tr>

      <tr>
        <td>Nazareth</td>
        <td>20</td>
        <td>Madrid</td>
      </tr>

      <tr>
        <td>Cyrus</td>
        <td>21</td>
        <td>Barcelona</td>
      </tr>

      <tr>
        <td>Loren</td>
        <td>20</td>
        <td>Sevilla</td>
      </tr>

      <tr>
        <td>Laura</td>
        <td>21</td>
        <td>Valencia</td>
      </tr>
    </table>
  </body>
</html>
