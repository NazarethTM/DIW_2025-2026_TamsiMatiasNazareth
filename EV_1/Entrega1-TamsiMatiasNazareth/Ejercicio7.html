<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Formulario</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        margin-top: 40px;
      }

      .contenedor {
        width: 250px;
      }

      label {
        display: block;
        margin-top: 10px;
      }

      input,
      select,
      button {
        width: 100%;
        margin-top: 5px;
      }

      button {
        background: blue;
        color: white;
        border: none;
        padding: 5px;
      }

      button:hover {
        background: green;
      }

      .mensaje {
        display: none;
        color: green;
        margin-top: 10px;
      }

      form:valid + .mensaje {
        display: block;
      }
    </style>
  </head>

  <body>
    <div class="contenedor">
      <h2>Formulario</h2>

      <form>
        <label>Nombre</label>
        <input type="text" required />

        <label>Edad</label>
        <input type="number" required />

        <label>Curso</label>
        <select required>
          <option value="">Selecciona tu curso</option>
          <option>1º DAW</option>
          <option>2º DAW</option>
          <option>ASIR</option>
        </select>

        <button type="submit">Enviar formulario</button>
      </form>

      <p class="mensaje">Formulario enviado correctamente</p>
    </div>
  </body>
</html>
