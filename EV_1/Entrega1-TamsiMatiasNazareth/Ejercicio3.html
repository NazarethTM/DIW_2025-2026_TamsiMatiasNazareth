<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .container {
        text-align: center;
      }

      h2 {
        margin-bottom: 20px;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(3, 200px);
        gap: 20px;
        justify-content: center;
      }

      .gallery img {
        width: 200px;
        height: 150px;
        object-fit: cover;
        border: 1px solid #555;
        border-radius: 10px;
      }
      .gallery img:hover {
        border: 1px solid #f4f4f4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2>Galería de Imágenes</h2>
      <div class="gallery">
        <img src="https://placehold.co/300x200" alt="Imagen 1" />
        <img src="https://placehold.co/300x200" alt="Imagen 2" />
        <img src="https://placehold.co/300x200" alt="Imagen 3" />
        <img src="https://placehold.co/300x200" alt="Imagen 4" />
        <img src="https://placehold.co/300x200" alt="Imagen 5" />
        <img src="https://placehold.co/300x200" alt="Imagen 6" />
      </div>
    </div>
  </body>
</html>
