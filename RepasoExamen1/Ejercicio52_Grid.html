<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 52 - Grid Anidado</title>
    <style>

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .container {
        max-width: 800px;
        width: 100%;
      }


      /* Grid principal */
      .main-grid {
        display: grid;
        grid-template-columns: 1fr 2fr; /* Primera columna mitad de ancho que la segunda */
        gap: 5px;
        padding: 5px;
      }

      /* Estilo común para las celdas */
      .cell {
        background-color: #333;
        color: white;
        padding: 20px;
        min-height: 120px;
      }

      /* Celda 1 */
      .cell-1 {
        background-color: #333;
        grid-column: 1;
        grid-row: 1;
      }

      /* Celda 2 */
      .cell-2 {
        background-color: #333;
        grid-column: 2;
        grid-row: 1;
      }

      /* Celda 3 */
      .cell-3 {
        background-color: #333;
        grid-column: 1;
        grid-row: 2;
      }

      /* Celda 4 (contiene el grid anidado) */
      .cell-4 {
        background-color: #333;
        grid-column: 2;
        grid-row: 2 / span 2; /* Ocupa desde fila 2 hasta fila 3 */
        padding: 15px;
      }

      /* Celda 5 */
      .cell-5 {
        background-color: #333;
        grid-column: 1;
        grid-row: 3;
      }

      /* Grid anidado dentro de celda 4 */
      .nested-grid {
        display: grid;
        grid-template-rows: auto auto auto; /* Tres filas */
        gap: 10px;
        height: 100%;
      }

      /* Primera fila del grid anidado - ocupa todo el ancho */
      .nested-row1 {
        background-color: #ccc;
        color: white;
        padding: 15px;
        text-align: center;
        font-weight: bold;
        grid-column: 1 / -1; /* Ocupa todo el ancho */
      }

      /* Contenedor para las filas 2 y 3 que tienen 2 columnas */
      .nested-row2,
      .nested-row3 {
        display: grid;
        grid-template-columns: 1fr 1fr; /* Dos columnas del mismo ancho */
        gap: 10px;
      }

      /* Estilo para las celdas internas de las filas 2 y 3 */
      .nested-cell {
        background-color: #ccc;
        color: white;
        padding: 15px;
        text-align: center;
        font-weight: bold;
      }

      /* Color diferente para las celdas de la fila 3 */
      .nested-row3 .nested-cell {
        background-color:#ccc;
      }

      /* Títulos */
      .cell-title {
        font-weight: bold;
        margin-bottom: 10px;
        display: block;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      
      <!-- Grid principal -->
      <div class="main-grid">
        <!-- Celda 1 -->
        <div class="cell cell-1">
          <span class="cell-title">celda 1</span>
        </div>

        <!-- Celda 2 -->
        <div class="cell cell-2">
          <span class="cell-title">celda 2</span>
        </div>

        <!-- Celda 3 -->
        <div class="cell cell-3">
          <span class="cell-title">celda 3</span>
        </div>

        <!-- Celda 4 con grid anidado -->
        <div class="cell-4">
          <div class="nested-grid">
            <!-- Primera fila: "Grid Anidado" (ocupa todo el ancho) -->
            <div class="nested-row1">Grid Anidado</div>

            <!-- Segunda fila: Lista 2 y Lista 3 -->
            <div class="nested-row2">
              <div class="nested-cell">Lista 2</div>
              <div class="nested-cell">Lista 3</div>
            </div>

            <!-- Tercera fila: Lista 4 y Lista 5 -->
            <div class="nested-row3">
              <div class="nested-cell">Lista 4</div>
              <div class="nested-cell">Lista 5</div>
            </div>
          </div>
        </div>

        <!-- Celda 5 -->
        <div class="cell cell-5">
          <span class="cell-title">celda 5</span>
        </div>
      </div>
      </div>
    </div>
  </body>
</html>
