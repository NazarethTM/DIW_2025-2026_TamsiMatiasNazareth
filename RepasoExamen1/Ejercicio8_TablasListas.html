<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio Repaso 8: Tablas y Listas</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 40px;
      }

      h1 {
        text-align: center;
      }

      table {
        width: 80%;
        margin: auto;
        border-collapse: collapse;
        background: white;
      }

      caption {
        font-size: 1.2em;
        margin-bottom: 10px;
        font-weight: bold;
      }

      th,
      td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: left;
      }

      th {
        background-color: #b5b5b5;
        color: black;
      }

      tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      dl {
        margin: 0;
      }

      dt {
        font-weight: bold;
      }

      dd {
        margin-left: 15px;
      }
    </style>
  </head>
  <body>
    <h1>Cursos disponibles</h1>

    <table>
      <caption>
        incormación sobre los cursos
      </caption>

      <thead>
        <tr>
          <th>Nombre del curso</th>
          <th>Duración</th>
          <th>Detalles</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>HTML y CSS</td>
          <td>4 semanas</td>
          <td>
            <dl>
              <dt>Instructor</dt>
              <dd>Laura Gómez</dd>

              <dt>Nivel</dt>
              <dd>Principiante</dd>
            </dl>
          </td>
        </tr>

        <tr>
          <td>JavaScript</td>
          <td>6 semanas</td>
          <td>
            <dl>
              <dt>Instructor</dt>
              <dd>Carlos Pérez</dd>

              <dt>Nivel</dt>
              <dd>Intermedio</dd>
            </dl>
          </td>
        </tr>

        <tr>
          <td>Desarrollo Backend con PHP</td>
          <td>8 semanas</td>
          <td>
            <dl>
              <dt>Instructor</dt>
              <dd>Ana Martínez</dd>

              <dt>Nivel</dt>
              <dd>Avanzado</dd>
            </dl>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
