<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 41 - Layout Flexbox BEM</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        font-family: Arial, sans-serif;}

      body.page {
        display: flex;
        flex-direction: column;
      }

      .page__header {
        background: #b5832c;
        color: #000;
        font-weight: bold;
        font-size: 24px;
        min-height: 24px;
        padding: 0 24px;
        display: flex;
        align-items: center;
      }

      .page__body {
        flex: 1;
        display: flex;
      }

      .page__col {
        padding: 24px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #fff;
      }

      .page__col--left,
      .page__col--right {
        background: #4a4a4a;
        flex: 1;
      }

      .page__col--center {
        background: #fff;
        color: #000;
        flex: 2;
      }
    </style>
  </head>
  <body class="page">
    <header class="page__header">Título de la página</header>

    <div class="page__body">
      <aside class="page__col page__col--left">Lateral izquierdo</aside>
      <main class="page__col page__col--center">Zona central</main>
      <aside class="page__col page__col--right">Lateral derecho</aside>
    </div>
  </body>
</html>
